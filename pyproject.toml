[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-forecasting-agent"
version = "1.0.0"
description = "Auditable terminal-valuation forecasting with bounded cognitive research"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "langgraph>=1.0,<2",
  "httpx>=0.28,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7",
  "numpy>=2,<3", "scipy>=1.14,<2", "pandas>=2.2,<3",
  "faiss-cpu>=1.9,<2", "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2", "plotly>=5.24,<7", "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
cognitive-forecast = "forecast_agent.cli:main"

[tool.setuptools.packages.find]
include = ["forecast_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".pytest_tmp", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]
"scripts/check_providers.py" = ["E402"]
"scripts/check_research.py" = ["E402"]
